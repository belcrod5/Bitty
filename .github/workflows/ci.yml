name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            expo/package-lock.json
            private_runner/package-lock.json

      - name: Install Expo dependencies
        working-directory: expo
        run: npm ci

      - name: Type-check Expo app
        working-directory: expo
        run: npx tsc --noEmit

      - name: Test Runner login UI and credential boundaries
        working-directory: expo
        run: npx jest --runInBand --silent src/features/app/components/RunnerLoginSettings.test.tsx src/features/app/hooks/useRunnerSessionLifecycle.test.tsx src/features/app/screens/RunnerLoginScreen.test.tsx src/features/app/utils/runnerLogin.test.ts src/features/app/utils/secureRunnerCredentials.test.ts src/features/app/utils/cloudflareAccessFetch.test.ts src/features/app/ttsAudio.test.ts

      - name: Install private runner dependencies
        working-directory: private_runner
        run: npm ci

      - name: Test Runner authentication and local control
        run: node --test private_runner/tests/runner-login.test.mjs private_runner/tests/runner-login-location.test.mjs private_runner/tests/runner-local-https.test.mjs private_runner/tests/runner-control-cli.test.mjs private_runner/tests/runner-websocket-upgrade.test.mjs

      - name: Test orchestrator runtime permissions
        run: node --test private_runner/tests/codex-app-server-client.test.mjs private_runner/tests/voice-orchestrator-service.test.mjs

      - name: Check shell scripts
        run: |
          bash -n scripts/worktree/bootstrap-local.sh
          bash -n private_runner/run-local.sh
          bash -n scripts/ios/build-expo-ios-device.sh
          bash -n scripts/maestro/prepare-ios-simulator.sh
          bash -n scripts/maestro/run-ios-simulator.sh
          bash -n scripts/maestro/run-ios-simulator-with-load-report.sh
          bash -n scripts/maestro/test-ios-simulator-scripts.sh
          ./scripts/maestro/test-ios-simulator-scripts.sh
